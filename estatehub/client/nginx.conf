server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 12m;   # property photo uploads

  location /api/     { proxy_pass http://server:5000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
  location /uploads/ { proxy_pass http://server:5000; }

  # React Router: unknown paths return index.html
  location / { try_files $uri /index.html; }
}
