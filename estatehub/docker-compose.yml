# Optional: run the whole project (MySQL + API + website) with one command.
#   1. copy .env.docker.example to .env  and fill in the two passwords/secret
#   2. docker compose up --build
#   3. first time only:  docker compose exec server npm run db:init     (creates tables + demo data)
#   4. open http://localhost:8080
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: development   # 'production' makes the login cookie HTTPS-only, which breaks plain http://localhost
      CLIENT_URL: http://localhost:8080
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: estatehub
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - uploads:/app/server/uploads

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    depends_on: [server]
    ports:
      - "8080:80"

volumes:
  dbdata:
  uploads:
